; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ATtiny1616]
platform = atmelmegaavr
board = ATtiny1616
board_build.f_cpu = 20000000L
board_hardware.oscillator = internal
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
build_flags = -Wl,-Map,output.map
; Dead fractional-N experiments. The tuner in adf4351_calc.cpp replaces them,
; and the float Farey code does not fit beside it in 16 KB.
build_src_filter = +<*> -<rational_approximation.cpp> -<test_rational_approximation.cpp> -<binaryGCD.cpp>
upload_port = /dev/serial/by-id/usb-FTDI_FT231X_USB_UART_DP04DFOI-if00-port0
upload_protocol = custom
upload_flags = "--tool uart --device $BOARD --uart $UPLOAD_PORT -b $UPLOAD_SPEED"
upload_command = pymcuprog write --erase $UPLOAD_FLAGS --filename $SOURCE
lib_deps = 
	robtillaart/CRC@^1.0.3
	msz98/serial-readline@^0.1.0

; Serial upload through Optiboot. Use scripts/upload-firmware.
; The application is linked above the 512 byte bootloader.
; USING_OPTIBOOT only labels the build. The 0x200 link address is what matters.
[env:ATtiny1616_optiboot]
platform = atmelmegaavr
board = ATtiny1616
board_build.f_cpu = 20000000L
board_build.text_section_start = 0x200
board_hardware.oscillator = internal
framework = arduino
lib_extra_dirs = ~/Documents/Arduino/libraries
build_flags = -DUSING_OPTIBOOT -Wl,-Map,output.map
build_src_filter = +<*> -<rational_approximation.cpp> -<test_rational_approximation.cpp> -<binaryGCD.cpp>
upload_port = /dev/serial/by-id/usb-FTDI_FT231X_USB_UART_DP04DFOI-if00-port0
upload_protocol = custom
upload_command = ../scripts/optiboot-upload $UPLOAD_PORT $SOURCE
lib_deps =
	robtillaart/CRC@^1.0.3
	msz98/serial-readline@^0.1.0
